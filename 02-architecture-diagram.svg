<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1150" viewBox="0 0 2000 1150" role="img" aria-labelledby="title desc">
  <title id="title">Architektura automatyzacji n8n i HubSpot od leada do deala</title>
  <desc id="desc">Czytelny diagram procesu od pozyskania leada, przez kwalifikację i obsługę kontaktu w HubSpot, po kontrolę duplikatów, utworzenie deala i osobną ścieżkę rejestrowania błędów.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#f5f7fa"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#7a8798"/>
    </marker>
    <marker id="errorArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#cf5f64"/>
    </marker>
    <style>
      .eyebrow { font: 600 15px 'Segoe UI', Arial, sans-serif; letter-spacing: 2.1px; fill: #6c7685; }
      .title { font: 700 38px 'Segoe UI', Arial, sans-serif; fill: #172033; letter-spacing: -.5px; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #637083; }
      .card-title { font: 700 19px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .card-subtitle { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #627084; }
      .tag { font: 700 11px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; }
      .meta { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #667386; }
      .error-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #8e313a; }
      .error-subtitle { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #76585c; }
      .footer { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #7d8998; }
      .connector { stroke: #8995a5; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .error-connector { stroke: #cf5f64; stroke-width: 2.5; fill: none; stroke-dasharray: 7 8; marker-end: url(#errorArrow); }
      .error-drop { stroke: #d77779; stroke-width: 2; fill: none; stroke-dasharray: 5 7; }
    </style>
  </defs>

  <rect width="2000" height="1150" fill="url(#bg)"/>

  <!-- Header -->
  <text x="108" y="100" class="eyebrow">ARCHITEKTURA AUTOMATYZACJI</text>
  <text x="108" y="151" class="title">Proces: od leada do deala</text>
  <text x="108" y="185" class="subtitle">n8n prowadzi niezawodny proces od zgłoszenia leada do utworzenia deala w HubSpot.</text>

  <g transform="translate(1610 95)">
    <circle cx="11" cy="-5" r="5" fill="#6b9af2"/>
    <text x="25" y="0" class="meta">Główny przepływ</text>
    <path d="M0 25 H16" stroke="#cf5f64" stroke-width="2.5" stroke-dasharray="5 5"/>
    <text x="25" y="30" class="meta">Obsługa błędów</text>
  </g>

  <!-- Main flow label -->
  <g transform="translate(108 260)">
    <rect width="143" height="31" rx="15.5" fill="#e9f0ff"/>
    <circle cx="20" cy="15.5" r="5" fill="#6b9af2"/>
    <text x="34" y="20" class="tag" fill="#446aa8">GŁÓWNY PRZEPŁYW</text>
  </g>
  <line x1="270" y1="275" x2="1879" y2="275" stroke="#dce3ea" stroke-width="1.5"/>

  <!-- Main flow connectors -->
  <path class="connector" d="M303 445 H321"/>
  <path class="connector" d="M526 445 H544"/>
  <path class="connector" d="M749 445 H767"/>
  <path class="connector" d="M972 445 H990"/>
  <path class="connector" d="M1210 445 H1228"/>
  <path class="connector" d="M1433 445 H1451"/>
  <path class="connector" d="M1656 445 H1674"/>

  <!-- Lead source -->
  <g filter="url(#shadow)">
    <rect x="108" y="320" width="195" height="250" rx="16" fill="#ffffff"/>
    <rect x="108" y="320" width="195" height="7" rx="3.5" fill="#6196eb"/>
  </g>
  <circle cx="142" cy="370" r="22" fill="#e9f1ff"/>
  <path d="M135 369a7 7 0 1 0 14 0a7 7 0 0 0-14 0m-8 16c1.8-6 7.3-9 15-9s13.2 3 15 9" fill="none" stroke="#4f7fca" stroke-width="2.4" stroke-linecap="round"/>
  <text x="134" y="425" class="card-title">Źródło leada</text>
  <text x="134" y="452" class="card-subtitle">Formularz, landing page</text>
  <text x="134" y="473" class="card-subtitle">lub narzędzie zewnętrzne</text>
  <rect x="134" y="508" width="111" height="27" rx="13.5" fill="#edf4ff"/>
  <text x="149" y="526" class="tag" fill="#4775bb">WEJŚCIE</text>

  <!-- Webhook -->
  <g filter="url(#shadow)">
    <rect x="331" y="320" width="195" height="250" rx="16" fill="#ffffff"/>
    <rect x="331" y="320" width="195" height="7" rx="3.5" fill="#f39a58"/>
  </g>
  <circle cx="365" cy="370" r="22" fill="#fff0e5"/>
  <circle cx="355" cy="370" r="4" fill="#ed7b36"/>
  <circle cx="371" cy="361" r="4" fill="#ed7b36"/>
  <circle cx="371" cy="379" r="4" fill="#ed7b36"/>
  <path d="M358 368l10-5m-10 9l10 5" fill="none" stroke="#ed7b36" stroke-width="2"/>
  <text x="357" y="425" class="card-title">Webhook</text>
  <text x="357" y="452" class="card-subtitle">Bezpieczny punkt wejścia</text>
  <text x="357" y="473" class="card-subtitle">dla danych leada</text>
  <rect x="357" y="508" width="87" height="27" rx="13.5" fill="#fff1e7"/>
  <text x="372" y="526" class="tag" fill="#bc5a25">n8n</text>

  <!-- Validation -->
  <g filter="url(#shadow)">
    <rect x="554" y="320" width="195" height="250" rx="16" fill="#ffffff"/>
    <rect x="554" y="320" width="195" height="7" rx="3.5" fill="#6f7d91"/>
  </g>
  <circle cx="588" cy="370" r="22" fill="#eff2f6"/>
  <rect x="578" y="359" width="20" height="22" rx="3" fill="none" stroke="#627184" stroke-width="2.2"/>
  <path d="M582 370l4 4l8-9" fill="none" stroke="#627184" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="580" y="425" class="card-title">Walidacja</text>
  <text x="580" y="452" class="card-subtitle">Pola wymagane</text>
  <text x="580" y="473" class="card-subtitle">i jakość danych</text>
  <rect x="580" y="508" width="107" height="27" rx="13.5" fill="#eff2f6"/>
  <text x="595" y="526" class="tag" fill="#5b6879">KONTROLA</text>

  <!-- Normalization -->
  <g filter="url(#shadow)">
    <rect x="777" y="320" width="195" height="250" rx="16" fill="#ffffff"/>
    <rect x="777" y="320" width="195" height="7" rx="3.5" fill="#5e9da2"/>
  </g>
  <circle cx="811" cy="370" r="22" fill="#e8f5f4"/>
  <path d="M801 364h16m-3-4l4 4l-4 4m4 8h-16m3-4l-4 4l4 4" fill="none" stroke="#43848a" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="803" y="425" class="card-title">Normalizacja</text>
  <text x="803" y="452" class="card-subtitle">Ujednolicenie nazw,</text>
  <text x="803" y="473" class="card-subtitle">e-maili i danych firmy</text>
  <rect x="803" y="508" width="106" height="27" rx="13.5" fill="#eaf6f5"/>
  <text x="818" y="526" class="tag" fill="#36787e">CZYSTE DANE</text>

  <!-- Qualification -->
  <g filter="url(#shadow)">
    <rect x="1000" y="320" width="210" height="250" rx="16" fill="#ffffff"/>
    <rect x="1000" y="320" width="210" height="7" rx="3.5" fill="#d49a38"/>
  </g>
  <circle cx="1034" cy="370" r="22" fill="#fff5df"/>
  <path d="M1025 371h18m-9-9v18" stroke="#b57919" stroke-width="2.2" stroke-linecap="round"/>
  <text x="1026" y="425" class="card-title">Kwalifikacja</text>
  <text x="1026" y="452" class="card-subtitle">Ocena i przekierowanie</text>
  <text x="1026" y="473" class="card-subtitle">każdego leada</text>
  <rect x="1026" y="501" width="80" height="30" rx="15" fill="#ffe7d7"/>
  <text x="1038" y="520" class="tag" fill="#b94e25">GORĄCY</text>
  <rect x="1113" y="501" width="70" height="30" rx="15" fill="#edf1f5"/>
  <text x="1123" y="520" class="tag" fill="#687687">ZIMNY</text>

  <!-- HubSpot Contact -->
  <g filter="url(#shadow)">
    <rect x="1238" y="320" width="195" height="250" rx="16" fill="#ffffff"/>
    <rect x="1238" y="320" width="195" height="7" rx="3.5" fill="#ff7a59"/>
  </g>
  <circle cx="1272" cy="370" r="22" fill="#fff0eb"/>
  <circle cx="1272" cy="370" r="5" fill="#ef6c4d"/>
  <circle cx="1272" cy="356" r="3.2" fill="#ef6c4d"/>
  <circle cx="1284" cy="376" r="3.2" fill="#ef6c4d"/>
  <path d="M1272 365v-6m4 7l6 8m-11 1h10" stroke="#ef6c4d" stroke-width="2" stroke-linecap="round"/>
  <text x="1264" y="425" class="card-title">Kontakt w HubSpot</text>
  <text x="1264" y="452" class="card-subtitle">Utwórz lub zaktualizuj</text>
  <text x="1264" y="473" class="card-subtitle">rekord kontaktu</text>
  <rect x="1264" y="508" width="105" height="27" rx="13.5" fill="#fff0eb"/>
  <text x="1279" y="526" class="tag" fill="#c95439">HUBSPOT</text>

  <!-- Duplicate protection -->
  <g filter="url(#shadow)">
    <rect x="1461" y="320" width="195" height="250" rx="16" fill="#ffffff"/>
    <rect x="1461" y="320" width="195" height="7" rx="3.5" fill="#896fbe"/>
  </g>
  <circle cx="1495" cy="370" r="22" fill="#f1ecfa"/>
  <path d="M1495 357l10 4v7c0 6.2-4.2 10.8-10 13c-5.8-2.2-10-6.8-10-13v-7l10-4z" fill="none" stroke="#7556a9" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M1490 369l3.5 3.5l6.5-7" fill="none" stroke="#7556a9" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1487" y="425" class="card-title">Kontrola duplikatów</text>
  <text x="1487" y="452" class="card-subtitle">Lokalny klucz idempotencji</text>
  <text x="1487" y="473" class="card-subtitle">+ otwarte deale w HubSpot</text>
  <rect x="1487" y="508" width="112" height="27" rx="13.5" fill="#f1ecfa"/>
  <text x="1502" y="526" class="tag" fill="#6a4c9d">BEZ DUPLIKATÓW</text>

  <!-- Deal creation -->
  <g filter="url(#shadow)">
    <rect x="1684" y="320" width="195" height="250" rx="16" fill="#ffffff"/>
    <rect x="1684" y="320" width="195" height="7" rx="3.5" fill="#4a9a7a"/>
  </g>
  <circle cx="1718" cy="370" r="22" fill="#e7f5ee"/>
  <path d="M1718 355l12 15l-12 15l-12-15z" fill="none" stroke="#398365" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M1715 366c.4-2 5.5-2.3 5.8.6c.2 2.9-6.2 1.6-6.2 4.6c0 3 5.3 3.2 6.1.6m-3-8v16" fill="none" stroke="#398365" stroke-width="1.8" stroke-linecap="round"/>
  <text x="1710" y="425" class="card-title">Tworzenie deala</text>
  <text x="1710" y="452" class="card-subtitle">Utwórz deal tylko, gdy</text>
  <text x="1710" y="473" class="card-subtitle">warunki są spełnione</text>
  <rect x="1710" y="508" width="113" height="27" rx="13.5" fill="#e9f6ef"/>
  <text x="1725" y="526" class="tag" fill="#33785d">BEZPIECZNIE</text>

  <!-- Error handling lane -->
  <g transform="translate(108 655)">
    <rect width="171" height="31" rx="15.5" fill="#fdebed"/>
    <path d="M22 9l8 14H14z" fill="#cf5f64"/>
    <rect x="21" y="14" width="2" height="5" rx="1" fill="#ffffff"/>
    <circle cx="22" cy="21.8" r="1.2" fill="#ffffff"/>
    <text x="43" y="20" class="tag" fill="#af454e">OBSŁUGA BŁĘDÓW</text>
  </g>
  <line x1="298" y1="670" x2="1879" y2="670" stroke="#ead7d9" stroke-width="1.5"/>

  <!-- Error source explanation -->
  <g filter="url(#softShadow)">
    <rect x="108" y="726" width="418" height="123" rx="14" fill="#fffafa"/>
  </g>
  <circle cx="145" cy="773" r="18" fill="#fdebed"/>
  <path d="M145 760l10 18h-20z" fill="#cf5f64"/>
  <rect x="144" y="766" width="2" height="6" rx="1" fill="#ffffff"/>
  <circle cx="145" cy="775.5" r="1.2" fill="#ffffff"/>
  <text x="178" y="767" class="error-title">Błąd integracji HubSpot / API</text>
  <text x="178" y="794" class="error-subtitle">Błąd jest rejestrowany bez utraty</text>
  <text x="178" y="815" class="error-subtitle">widoczności głównego przepływu.</text>

  <!-- Drops from integration cards into error bus -->
  <path class="error-drop" d="M1335 570 V708 H694 V787"/>
  <path class="error-drop" d="M1558 570 V708 H694 V787"/>
  <path class="error-drop" d="M1781 570 V708 H694 V787"/>
  <circle cx="1335" cy="708" r="4" fill="#d77779"/>
  <circle cx="1558" cy="708" r="4" fill="#d77779"/>
  <circle cx="1781" cy="708" r="4" fill="#d77779"/>
  <text x="1335" y="700" class="footer" text-anchor="middle" fill="#aa5b61">Kroki HubSpot / API</text>

  <!-- Error connector and destination cards -->
  <path class="error-connector" d="M526 787 H694"/>
  <g filter="url(#softShadow)">
    <rect x="716" y="726" width="256" height="123" rx="14" fill="#ffffff"/>
    <rect x="716" y="726" width="7" height="123" rx="3.5" fill="#cf5f64"/>
  </g>
  <circle cx="758" cy="773" r="18" fill="#fdebed"/>
  <path d="M750 773h16m-8-8v16m-11 11l5-5m15 5l-5-5m0-28l5 5m-20-5l5 5" stroke="#bd515a" stroke-width="2" stroke-linecap="round"/>
  <text x="793" y="768" class="error-title">Rejestr błędów</text>
  <text x="793" y="795" class="error-subtitle">Zapisz kontekst, krok</text>
  <text x="793" y="816" class="error-subtitle">oraz szczegóły błędu</text>
  <path class="error-connector" d="M972 787 H1140"/>
  <g filter="url(#softShadow)">
    <rect x="1162" y="726" width="300" height="123" rx="14" fill="#ffffff"/>
    <rect x="1162" y="726" width="7" height="123" rx="3.5" fill="#cf5f64"/>
  </g>
  <ellipse cx="1204" cy="758" rx="17" ry="7" fill="#fdebed" stroke="#bd515a" stroke-width="2"/>
  <path d="M1187 758v23c0 4 7.6 7 17 7s17-3 17-7v-23m-34 12c0 4 7.6 7 17 7s17-3 17-7" fill="#fdebed" stroke="#bd515a" stroke-width="2"/>
  <text x="1241" y="768" class="error-title">workflow_errors</text>
  <text x="1241" y="795" class="error-subtitle">Centralny rejestr do</text>
  <text x="1241" y="816" class="error-subtitle">analizy i diagnostyki</text>

  <!-- Footer -->
  <line x1="108" y1="955" x2="1879" y2="955" stroke="#e0e6ec" stroke-width="1.5"/>
  <text x="108" y="1000" class="footer">Diagram pokazuje logikę biznesową, a nie każdy pojedynczy node w canvasie n8n.</text>
  <text x="1879" y="1000" class="footer" text-anchor="end">n8n + HubSpot</text>
</svg>
